<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ลอยกระทงออนไลน์</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#070a20;overflow:hidden;font-family:'Mitr',system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 14px 6px;text-align:center;pointer-events:none}
#title{font-size:20px;font-weight:600;color:#ffe2a0;text-shadow:0 0 12px rgba(255,170,70,.9)}
#count{font-size:13px;opacity:.9;margin-top:2px;text-shadow:0 1px 4px #000}
#toasts{position:fixed;top:calc(66px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(20,14,50,.78);border:1px solid rgba(255,200,120,.55);border-radius:999px;padding:6px 14px;font-size:13px;animation:tt 5s forwards;max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes tt{0%{opacity:0;transform:translateY(-8px)}8%,82%{opacity:1;transform:none}100%{opacity:0}}
#panel{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(14,10,40,.84);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,200,120,.35);border-radius:18px;padding:12px;transition:transform .4s;max-width:520px;margin:0 auto}
#panel.hide{transform:translateY(calc(100% + 40px))}
.row{display:flex;gap:8px;margin-bottom:10px}
.tab{flex:1;padding:9px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;font:inherit;font-size:15px}
.tab.on{background:linear-gradient(#ffc061,#ff7b3a);border-color:transparent;color:#2a1000;font-weight:600}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);font:inherit;font-size:12px;color:#fff}
.st.on{border-color:#ffc46b;background:rgba(255,196,107,.16)}
.st i{width:22px;height:22px;border-radius:50%;display:block;box-shadow:0 0 8px rgba(255,255,255,.3)}
input{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);color:#fff;font:inherit;font-size:16px;outline:none}
input::placeholder{color:rgba(255,255,255,.5)}
#go{margin-top:10px;width:100%;padding:12px;border:0;border-radius:12px;background:linear-gradient(#ffd77f,#ff8a3d);color:#2a1000;font:inherit;font-size:17px;font-weight:600}
#go:disabled{opacity:.5}
#msg{font-size:12px;color:#ffc2a8;min-height:16px;margin-top:6px;text-align:center}
#again{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));padding:10px 18px;border-radius:999px;border:1px solid rgba(255,200,120,.65);background:rgba(14,10,40,.82);color:#ffe2a0;font:inherit;font-size:15px;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><div id="title">🪷 ลอยกระทงออนไลน์ 🏮</div><div id="count">กำลังโหลด…</div></div>
<div id="toasts"></div>
<div id="panel">
  <div class="row">
    <button class="tab on" data-k="k">🪷 ลอยกระทง</button>
    <button class="tab" data-k="l">🏮 ปล่อยโคม</button>
  </div>
  <div class="row" id="styles">
    <button class="st on" data-s="0"><i style="background:#ff8fc0"></i>บัวชมพู</button>
    <button class="st" data-s="1"><i style="background:#ffa726"></i>ดาวเรือง</button>
    <button class="st" data-s="2"><i style="background:#f4f1e6"></i>มะลิขาว</button>
  </div>
  <input id="wish" maxlength="60" placeholder="คำอธิษฐาน (ไม่ใส่ก็ได้)">
  <button id="go">ลอยกระทง</button>
  <div id="msg"></div>
</div>
<button id="again">🪷 ลอยอีก</button>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzLr-x0abBpIlu3yi_LhzDYrMEEvCL0SHiD-KPcpyWBKhvrSERheJHR6UYGwifzx07nwA/exec';
const tg = window.Telegram && Telegram.WebApp;
const inTG = !!(tg && tg.initData);
const chat = inTG ? (tg.initDataUnsafe.start_param || '') : '';
const DEMO = !inTG || !chat;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#0b1030'); tg.setBackgroundColor && tg.setBackgroundColor('#070a20'); } catch (e) {} }

const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const bg = document.createElement('canvas'), bctx = bg.getContext('2d');
let W, H, DPR, HZ, moon, stars = [], ambient = [], shimmer = [];

function hash(s) { let h = 2166136261; for (const ch of String(s)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return (h >>> 0) % 2147483646 + 1; }
function seeded(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

// ---------- ฉากพื้นหลัง (วาดครั้งเดียว) ----------
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight; HZ = H * 0.46;
  for (const c of [cv, bg]) { c.width = W * DPR; c.height = H * DPR; }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  moon = { x: W * 0.72, y: H * 0.14, r: Math.min(W, H) * 0.075 };
  const r = seeded(7);
  stars = Array.from({ length: 110 }, () => ({ x: r() * W, y: r() * HZ * 0.9, s: r() * 1.4 + 0.3, p: r() * 6 }));
  ambient = Array.from({ length: 22 }, () => ({ fx: r(), p: r(), sp: 0.012 + r() * 0.012, sc: 0.25 + r() * 0.4, ph: r() * 6 }));
  shimmer = Array.from({ length: 140 }, () => ({ d: r(), x: r(), len: 8 + r() * 30, sp: 4 + r() * 10, ph: r() * 6 }));
  buildStatic();
}

function buildStatic() {
  const c = bctx;
  let g = c.createLinearGradient(0, 0, 0, HZ);
  g.addColorStop(0, '#060a26'); g.addColorStop(0.55, '#1d1650'); g.addColorStop(1, '#5a2a5e');
  c.fillStyle = g; c.fillRect(0, 0, W, HZ);
  // พระจันทร์
  g = c.createRadialGradient(moon.x, moon.y, moon.r * 0.8, moon.x, moon.y, moon.r * 4);
  g.addColorStop(0, 'rgba(255,230,170,.45)'); g.addColorStop(1, 'rgba(255,230,170,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, HZ);
  g = c.createRadialGradient(moon.x - moon.r * .3, moon.y - moon.r * .3, moon.r * .1, moon.x, moon.y, moon.r);
  g.addColorStop(0, '#fffbe8'); g.addColorStop(1, '#ffe3a1');
  c.fillStyle = g; c.beginPath(); c.arc(moon.x, moon.y, moon.r, 0, 7); c.fill();
  c.fillStyle = 'rgba(210,170,100,.18)';
  [[-.3, -.1, .22], [.25, .2, .16], [.05, .35, .1], [-.1, .3, .08]].forEach(([a, b, s]) => { c.beginPath(); c.arc(moon.x + a * moon.r, moon.y + b * moon.r, s * moon.r, 0, 7); c.fill(); });
  // ภูเขา
  const r = seeded(11);
  [['#241a4e', .14, .2], ['#1a1238', .08, .12]].forEach(([col, hgt, base]) => {
    c.fillStyle = col; c.beginPath(); c.moveTo(0, HZ);
    const k = r() * 6;
    for (let x = 0; x <= W; x += 8) c.lineTo(x, HZ - H * base * 0.3 - H * hgt * (0.5 + 0.5 * Math.sin(x / W * 5 + k) * Math.sin(x / W * 2.3 + k)));
    c.lineTo(W, HZ); c.fill();
  });
  // ต้นไม้ริมฝั่ง
  c.fillStyle = '#0f0b26';
  for (let x = -10; x < W + 20; x += 14 + r() * 18) { const rr = 8 + r() * 16; c.beginPath(); c.arc(x, HZ - rr * 0.5, rr, 0, 7); c.fill(); }
  // เจดีย์ทอง
  drawChedi(c, W * 0.24, HZ, Math.min(H * 0.27, W * 0.55));
  drawChedi(c, W * 0.9, HZ, Math.min(H * 0.12, W * 0.25));
  // น้ำ
  g = c.createLinearGradient(0, HZ, 0, H);
  g.addColorStop(0, '#3a2160'); g.addColorStop(0.25, '#1b1650'); g.addColorStop(1, '#05071a');
  c.fillStyle = g; c.fillRect(0, HZ, W, H - HZ);
  // ไฟริมฝั่ง + เงาสะท้อน
  const cols = ['#ffd27a', '#ff9a5a', '#fff0b0', '#ff7aa8'];
  for (let x = 4; x < W; x += 11) {
    const col = cols[(x / 11 | 0) % 4];
    const rg = c.createLinearGradient(0, HZ, 0, HZ + 40);
    rg.addColorStop(0, col + '55'); rg.addColorStop(1, col + '00');
    c.fillStyle = rg; c.fillRect(x - 1, HZ, 2, 40);
    c.fillStyle = col; c.beginPath(); c.arc(x, HZ - 3, 1.6, 0, 7); c.fill();
  }
  c.fillStyle = 'rgba(255,190,110,.12)'; c.fillRect(0, HZ - 6, W, 6);
}

function drawChedi(c, cx, base, h) {
  c.save();
  const g = c.createLinearGradient(cx - h * .3, 0, cx + h * .3, 0);
  g.addColorStop(0, '#9a5a12'); g.addColorStop(0.45, '#ffe08a'); g.addColorStop(1, '#b86d18');
  c.fillStyle = g; c.shadowColor = 'rgba(255,190,80,.8)'; c.shadowBlur = h * 0.12;
  let y = base;
  [[.62, .07], [.5, .06], [.4, .05], [.32, .05]].forEach(([w, t]) => { c.fillRect(cx - h * w / 2, y - h * t, h * w, h * t); y -= h * t; });
  c.beginPath(); c.moveTo(cx - h * .16, y);
  c.bezierCurveTo(cx - h * .17, y - h * .16, cx - h * .06, y - h * .22, cx, y - h * .23);
  c.bezierCurveTo(cx + h * .06, y - h * .22, cx + h * .17, y - h * .16, cx + h * .16, y); c.fill();
  y -= h * .22;
  c.fillRect(cx - h * .05, y - h * .05, h * .1, h * .05); y -= h * .05;
  c.beginPath(); c.moveTo(cx - h * .035, y); c.lineTo(cx, y - h * .32); c.lineTo(cx + h * .035, y); c.fill();
  c.restore();
  c.fillStyle = 'rgba(120,60,10,.35)';
  for (let i = 1; i < 6; i++) c.fillRect(cx - h * .035 * (1 - i / 7), y - h * .32 * i / 7, h * .07 * (1 - i / 7), 1.2);
}

// ---------- กระทง / โคม ----------
const PET = [['#ff7fb6', '#ffc6e0'], ['#ff9b1f', '#ffd54f'], ['#e9e4d3', '#ffffff']];
function petal(ang, px, py, len, w, col) {
  ctx.save(); ctx.translate(px, py); ctx.rotate(ang); ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(w, -len * .55, 0, -len); ctx.quadraticCurveTo(-w, -len * .55, 0, 0); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = .6; ctx.stroke(); ctx.restore();
}
function glow(x, y, r, col) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(255,180,80,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
function drawKrathong(k, t) {
  const sc = 0.45 + k.d * 0.8;
  const y = HZ + 22 + Math.pow(k.d, 1.25) * (H - HZ - 70) + Math.sin(t * 1.6 + k.ph) * 2 * sc;
  k.sx = k.x; k.sy = y; k.ss = sc;
  ctx.save(); ctx.translate(k.x, y); ctx.scale(sc, sc);
  // เงาแสงบนน้ำ
  let g = ctx.createLinearGradient(0, 0, 0, 90);
  g.addColorStop(0, 'rgba(255,190,90,.5)'); g.addColorStop(1, 'rgba(255,190,90,0)');
  ctx.fillStyle = g; for (let i = 0; i < 5; i++) { const w = 10 - i * 1.5 + Math.sin(t * 3 + i + k.ph) * 2; ctx.fillRect(-w / 2, 6 + i * 16, w, 9); }
  ctx.rotate(Math.sin(t * 1.3 + k.ph) * 0.045);
  glow(0, -26, 55, 'rgba(255,200,110,.38)');
  // ฐานใบตอง
  ctx.fillStyle = '#1f6a2a'; ctx.beginPath(); ctx.ellipse(0, 0, 31, 9, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#3d9a45';
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2, px = Math.cos(a) * 28, py = Math.sin(a) * 7.5 - 2;
    ctx.beginPath(); ctx.moveTo(px - 4.5, py); ctx.lineTo(px + 4.5, py); ctx.lineTo(px, py - 9); ctx.fill();
  }
  const [c1, c2] = PET[k.it.style || 0];
  for (let i = 0; i < 8; i++) { const f = i / 7 * 2 - 1; petal(f * 0.95, f * 18, -4, 18, 7, c1); }
  // เทียน ธูป
  ctx.fillStyle = '#fff1cf'; ctx.fillRect(-2.2, -32, 4.4, 18);
  ctx.strokeStyle = '#7a4a22'; ctx.lineWidth = 1.2;
  [[-7, -0.25], [7, 0.25], [4, 0.12]].forEach(([dx, a]) => { ctx.beginPath(); ctx.moveTo(dx * .4, -12); ctx.lineTo(dx * .4 + Math.sin(a) * 26, -12 - Math.cos(a) * 26); ctx.stroke();
    ctx.fillStyle = '#ff5a2a'; ctx.beginPath(); ctx.arc(dx * .4 + Math.sin(a) * 26, -12 - Math.cos(a) * 26, 1.3, 0, 7); ctx.fill(); });
  for (let i = 0; i < 5; i++) { const f = i / 4 * 2 - 1; petal(f * 0.7, f * 10, -2, 14, 6, c2); }
  // เปลวไฟ
  const fl = 1 + Math.sin(t * 13 + k.ph) * 0.13 + Math.sin(t * 7.3 + k.ph) * 0.07;
  glow(0, -37, 18, 'rgba(255,220,120,.85)');
  ctx.fillStyle = '#ffcf5a'; ctx.beginPath(); ctx.ellipse(0, -38, 3, 6 * fl, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fffbe6'; ctx.beginPath(); ctx.ellipse(0, -37, 1.5, 3 * fl, 0, 0, 7); ctx.fill();
  ctx.restore();
  label(k, k.x, y - 52 * sc, Math.max(10, 9 + sc * 5), t);
}
function drawLantern(x, y, sc, t, ph, lab) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.rotate(Math.sin(t * .8 + ph) * 0.06);
  glow(0, 0, 40, 'rgba(255,170,70,.45)');
  const g = ctx.createLinearGradient(0, -14, 0, 14);
  g.addColorStop(0, '#ffe29a'); g.addColorStop(1, '#ff7a24');
  ctx.fillStyle = g; ctx.beginPath();
  ctx.moveTo(-9, -14); ctx.quadraticCurveTo(0, -18, 9, -14); ctx.lineTo(12, 12); ctx.quadraticCurveTo(0, 15, -12, 12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff6c8'; ctx.beginPath(); ctx.ellipse(0, 12, 4, 2 + Math.sin(t * 10 + ph), 0, 0, 7); ctx.fill();
  ctx.restore();
}
function label(k, x, y, fs, t) {
  const isNew = k.born && (t - k.born) < 10, mine = k.it.id === myId;
  ctx.font = `600 ${fs}px Mitr, sans-serif`;
  const txt = k.it.name, w = ctx.measureText(txt).width + fs;
  ctx.fillStyle = 'rgba(15,10,45,.62)';
  ctx.strokeStyle = mine ? '#7fe0ff' : isNew ? '#ffd27a' : 'rgba(255,220,160,.35)';
  ctx.lineWidth = mine || isNew ? 1.6 : 1;
  ctx.beginPath(); (ctx.roundRect ? ctx.roundRect(x - w / 2, y - fs * .85, w, fs * 1.6, fs) : ctx.rect(x - w / 2, y - fs * .85, w, fs * 1.6)); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, x, y);
}

// ---------- ข้อมูล ----------
const sprites = new Map();
let lastList = [], firstLoad = true, myId = null, total = 0, tNow = 0;
function makeSprite(it, fresh) {
  const r = seeded(hash(it.id));
  if (it.kind === 'l') return { it, l: true, fx: .06 + .88 * r(), p: fresh ? 0 : r() * .9, sp: .018 + .01 * r(), sc: .75 + .35 * r(), ph: r() * 6, born: fresh ? tNow : 0 };
  const d = r();
  return { it, d, x: fresh ? -50 : r() * (W + 100) - 50, ph: r() * 6, born: fresh ? tNow : 0 };
}
function syncItems(list, ownId) {
  lastList = list;
  const ks = list.filter(i => i.kind !== 'l').slice(-60), ls = list.filter(i => i.kind === 'l').slice(-30);
  const keep = new Set();
  for (const it of ks.concat(ls)) {
    keep.add(it.id);
    if (!sprites.has(it.id)) {
      const fresh = !firstLoad;
      sprites.set(it.id, makeSprite(it, fresh));
      if (fresh) toast(it.id === ownId ? (it.kind === 'l' ? '✨ โคมของคุณลอยขึ้นฟ้าแล้ว' : '✨ กระทงของคุณลอยไปแล้ว')
        : `${it.kind === 'l' ? '🏮' : '🪷'} ${it.name} ${it.kind === 'l' ? 'ปล่อยโคม' : 'ลอยกระทง'}${it.wish ? ' — ' + it.wish : ''}`);
    }
  }
  for (const id of [...sprites.keys()]) if (!keep.has(id)) sprites.delete(id);
  firstLoad = false;
}
function setCount(n) { total = n; $('count').textContent = `ลอยไปแล้ว ${n.toLocaleString('th-TH')} รายการ · แตะกระทงเพื่ออ่านคำอธิษฐาน`; }
function toast(s) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = s;
  const box = $('toasts'); box.appendChild(d); while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => d.remove(), 5200);
}
async function poll() {
  if (DEMO) return;
  try {
    const j = await (await fetch(API + '?action=list&chat=' + encodeURIComponent(chat))).json();
    if (j.ok) { syncItems(j.items); setCount(j.total); }
  } catch (e) {}
}

// ---------- แอนิเมชัน ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; tNow = now / 1000; const t = tNow;
  ctx.drawImage(bg, 0, 0, W, H);
  for (const s of stars) { ctx.globalAlpha = .35 + .65 * Math.abs(Math.sin(t * .8 + s.p)); ctx.fillStyle = '#fff'; ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.globalAlpha = 1;
  for (const a of ambient) {
    a.p += a.sp * dt; if (a.p > 1) a.p = 0;
    drawLantern(a.fx * W + Math.sin(t * .4 + a.ph) * 10, HZ - a.p * (HZ + 30), a.sc * (1 - .5 * a.p), t, a.ph);
  }
  // ประกายน้ำ + เงาพระจันทร์
  for (const s of shimmer) {
    const y = HZ + 4 + Math.pow(s.d, 1.7) * (H - HZ);
    const x = ((s.x * W + t * s.sp) % (W + 40)) - 20;
    ctx.globalAlpha = (.06 + .2 * Math.abs(Math.sin(t * 1.5 + s.ph))) * (1 - s.d * .5);
    ctx.fillStyle = s.d < .5 ? '#ffb27a' : '#8a7cff'; ctx.fillRect(x, y, s.len * (.4 + s.d), 1.2);
  }
  for (let i = 0; i < 26; i++) {
    const y = HZ + 6 + i * i * (H - HZ) / 700, w = (6 + i * 2.2) * (.6 + .4 * Math.sin(t * 2 + i * 1.7));
    ctx.globalAlpha = .38 - i * .012; ctx.fillStyle = '#fff1c4';
    ctx.fillRect(moon.x - w / 2 + Math.sin(t + i) * 4, y, w, 1.6 + i * .08);
  }
  ctx.globalAlpha = 1;
  const arr = [...sprites.values()];
  for (const s of arr) if (s.l) {
    s.p += s.sp * dt * .6; if (s.p > 1) s.p = 0;
    const x = s.fx * W + Math.sin(t * .5 + s.ph) * 14, y = HZ - 10 - s.p * (HZ + 20), sc = s.sc * (1 - .45 * s.p);
    s.sx = x; s.sy = y; s.ss = sc;
    drawLantern(x, y, sc, t, s.ph);
    label(s, x, y + 26 * sc, Math.max(10, 8 + sc * 5), t);
  }
  const ks = arr.filter(s => !s.l).sort((a, b) => a.d - b.d);
  for (const k of ks) { k.x += (9 + k.d * 22) * dt; if (k.x > W + 60) k.x = -60; drawKrathong(k, t); }
  requestAnimationFrame(frame);
}

// ---------- ฟอร์ม ----------
let kind = 'k', style = 0;
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  kind = b.dataset.k; $('styles').style.display = kind === 'l' ? 'none' : 'flex';
  $('go').textContent = kind === 'l' ? 'ปล่อยโคม' : 'ลอยกระทง';
});
document.querySelectorAll('.st').forEach(b => b.onclick = () => {
  document.querySelectorAll('.st').forEach(x => x.classList.toggle('on', x === b)); style = +b.dataset.s;
});
$('again').onclick = () => { $('panel').classList.remove('hide'); $('again').style.display = 'none'; };
$('go').onclick = async () => {
  const wish = $('wish').value.trim().slice(0, 60), go = $('go'), msg = $('msg');
  go.disabled = true; msg.textContent = '';
  try {
    let it;
    if (DEMO) {
      it = { id: 'me' + Date.now(), name: 'คุณ', wish, kind, style, ts: Date.now() / 1000 };
      setCount(total + 1);
    } else {
      const j = await (await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'float', initData: tg.initData, wish, kind, style }) })).json();
      if (!j.ok) { msg.textContent = j.error || 'ลอยไม่สำเร็จ ลองใหม่อีกครั้ง'; go.disabled = false; return; }
      it = j.item; setCount(total + 1);
    }
    myId = it.id; syncItems(lastList.concat([it]), it.id);
    try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
    $('wish').value = ''; $('panel').classList.add('hide'); $('again').style.display = 'block';
    $('again').textContent = kind === 'l' ? '🏮 ปล่อยอีก' : '🪷 ลอยอีก';
  } catch (e) { msg.textContent = 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'; }
  go.disabled = false;
};
cv.addEventListener('click', e => {
  let best = null, bd = 1e9;
  for (const s of sprites.values()) {
    if (s.sx == null) continue;
    const dy = s.l ? 0 : 25 * s.ss;
    const d = Math.hypot(s.sx - e.clientX, s.sy - dy - e.clientY);
    if (d < 45 * Math.max(.7, s.ss) && d < bd) { bd = d; best = s; }
  }
  if (best) toast(`${best.l ? '🏮' : '🪷'} ${best.it.name}: ${best.it.wish || '(ไม่ได้เขียนคำอธิษฐาน)'}`);
});

addEventListener('resize', resize);
resize();
if (DEMO) {
  const names = ['น้องฟ้า', 'พี่ต้น', 'มะปราง', 'ลุงหนวด', 'จิ๊บ', 'บอย', 'แม่ค้าออนไลน์', 'สมชาย', 'เจ๊หมวย', 'ป๊อป', 'ใบเตย', 'ก้อง'];
  const wishes = ['ขอให้รวย ๆ', 'ขอให้สุขภาพแข็งแรง', 'ขอให้เจอคนดี ๆ', 'สอบผ่าน', 'ขายดีเทน้ำเทท่า', ''];
  const demo = names.map((n, i) => ({ id: 'd' + i, name: n, wish: wishes[i % wishes.length], kind: i % 4 === 3 ? 'l' : 'k', style: i % 3, ts: 0 }));
  syncItems(demo); setCount(demo.length);
  $('msg').textContent = 'โหมดตัวอย่าง — เปิดจากปุ่มในกลุ่มเทเลแกรมเพื่อลอยจริง';
  setTimeout(() => syncItems(lastList.concat([{ id: 'dn', name: 'ใหม่', wish: 'ขอให้ปีหน้าดีกว่าเดิม', kind: 'k', style: 1 }])), 3500);
} else { poll(); setInterval(poll, 4000); }
requestAnimationFrame(frame);
</script>
