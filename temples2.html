<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ไหว้พระ 9 วัด</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#140404;overflow:hidden;font-family:'Mitr',system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 14px 6px;text-align:center;pointer-events:none}
#title{font-size:21px;font-weight:600;color:#ffe08a;text-shadow:0 0 10px rgba(255,170,40,.9),0 2px 4px #000}
#sub{font-size:12px;color:#ffd9a0;margin-top:1px;text-shadow:0 1px 3px #000}
#count{font-size:12px;opacity:.9;margin-top:2px;text-shadow:0 1px 3px #000}
#toasts{position:fixed;top:calc(78px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:5}
.toast{background:rgba(40,10,6,.82);border:1px solid rgba(255,205,110,.6);border-radius:999px;padding:6px 14px;font-size:13px;animation:tt 5s forwards;max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes tt{0%{opacity:0;transform:translateY(-8px)}8%,82%{opacity:1;transform:none}100%{opacity:0}}
#welcome{position:fixed;left:100px;right:10px;top:calc(12px + env(safe-area-inset-top));text-align:center;font-size:17px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(40,8,5,.55);border:1px solid rgba(255,205,110,.55);border-radius:14px;padding:4px 10px !important;font-weight:600;color:#ffe08a;text-shadow:0 0 14px rgba(255,170,40,.95),0 2px 6px #000;pointer-events:none;opacity:0;z-index:3;padding:0 16px}
#welcome.show{animation:wl 4.5s forwards}
@keyframes wl{0%{opacity:0;transform:scale(.85)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#panel{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(36,8,6,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,205,110,.45);border-radius:18px;padding:12px;transition:transform .4s;max-width:520px;margin:0 auto;z-index:4}
#panel.hide{transform:translateY(calc(100% + 40px))}
.row{display:flex;gap:8px;margin-bottom:10px}
.tab{flex:1;padding:9px 4px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;font:inherit;font-size:14px}
.tab.on{background:linear-gradient(#ffe08a,#e0a020);border-color:transparent;color:#3a1500;font-weight:600}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);font:inherit;font-size:12px;color:#fff}
.st b{font-size:20px;font-weight:400}
.st.on{border-color:#ffd27a;background:rgba(255,210,122,.16)}
input{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);color:#fff;font:inherit;font-size:16px;outline:none}
input::placeholder{color:rgba(255,255,255,.5)}
#go{margin-top:10px;width:100%;padding:12px;border:0;border-radius:12px;background:linear-gradient(#ffe7a0,#e8a628);color:#3a1500;font:inherit;font-size:17px;font-weight:600}
#go:disabled{opacity:.5}
#msg{font-size:12px;color:#ffc9a8;min-height:16px;margin-top:6px;text-align:center}
#ytbox{position:fixed;left:10px;top:200px;width:200px;height:113px;border:2px solid #e0ad48;border-radius:10px;overflow:hidden;background:#000;z-index:7;opacity:0;pointer-events:none;transition:opacity .4s}
#ytbox.on{opacity:.01;pointer-events:none;left:0 !important;top:0 !important;z-index:0}
#ytbox.big{opacity:1;pointer-events:auto;left:50% !important;top:56% !important;width:72px;height:52px;transform:translate(-50%,-50%);z-index:21;border:none;border-radius:14px;box-shadow:0 0 0 3px #e0ad48,0 0 28px 6px rgba(255,180,60,.85);animation:glowp 1.6s infinite}
#ytbox.big iframe{position:absolute;width:300px !important;height:169px !important;left:-114px;top:-58.5px}
@keyframes glowp{50%{box-shadow:0 0 0 3px #ffe08a,0 0 40px 12px rgba(255,190,70,.95)}}
#gate{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 45%,rgba(90,20,10,.92),rgba(15,3,3,.97));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;transition:opacity .6s}
#gate.off{opacity:0;pointer-events:none}
#gate h1{margin:0 0 6px;font-size:26px;color:#ffe08a;text-shadow:0 0 14px rgba(255,170,40,.9)}
#gate p{margin:0;font-size:15px;color:#ffd9a0}
#gate .sp{height:110px}
#gate .tap{margin-top:8px;font-size:16px;color:#fff;animation:pulse 1.2s infinite}
#ythint{position:fixed;left:10px;width:204px;top:320px;text-align:center;font-size:13px;color:#ffe08a;background:rgba(40,8,5,.85);border:1px solid #e0ad48;border-radius:8px;padding:4px 0;z-index:7;display:none;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
#ytbox iframe{width:100%;height:100%;display:block}
#snd{display:none !important;position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,205,110,.6);background:rgba(36,8,6,.8);font-size:18px;z-index:6;padding:0}
#again{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));padding:10px 18px;border-radius:999px;border:1px solid rgba(255,205,110,.7);background:rgba(36,8,6,.86);color:#ffe08a;font:inherit;font-size:15px;display:none;z-index:4}
#lobby{position:fixed;inset:0;z-index:30;overflow-y:auto;background:radial-gradient(circle at 50% 20%,#4a0e0c,#140404 70%);padding:calc(18px + env(safe-area-inset-top)) 12px 24px;box-sizing:border-box;transition:opacity .4s}
#lobby.off{opacity:0;pointer-events:none}
#lobby h1{margin:0;text-align:center;font-size:24px;color:#ffe08a;text-shadow:0 0 14px rgba(255,170,40,.9)}
#lobby p{margin:4px 0 14px;text-align:center;font-size:14px;color:#ffd9a0}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:0 auto}
.card{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:2px solid #e0ad48;background:#2a0707 center/cover no-repeat;box-shadow:0 0 14px rgba(255,180,60,.35);color:#fff;font:inherit;padding:0;cursor:pointer}
.card .nm{position:absolute;left:0;right:0;bottom:0;padding:18px 4px 6px;font-size:13px;line-height:1.25;font-weight:600;color:#ffe08a;background:linear-gradient(transparent,rgba(20,3,3,.92));text-shadow:0 1px 3px #000}
.card .no{position:absolute;top:5px;left:6px;font-size:11px;background:rgba(40,8,5,.8);border:1px solid #e0ad48;border-radius:999px;padding:0 7px;color:#ffe08a}
.card.soon{border-color:rgba(224,173,72,.35);box-shadow:none;cursor:default}
.card.soon .nm{color:rgba(255,224,138,.55)}
.card.soon .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;opacity:.45}
#home{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top));z-index:8;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,205,110,.7);background:rgba(36,8,6,.85);color:#ffe08a;font:inherit;font-size:13px;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lobby"><h1>🙏 ไหว้พระ 9 วัด 🙏</h1><p>เลือกวัดที่ต้องการเข้าไปกราบไหว้</p><div id="grid"></div></div>
<button id="home">🏠 วัดอื่น</button>
<div id="top"><div id="title" style="display:none">🙏 วัดมะขาม 🙏</div><div id="sub"></div><div id="count">กำลังโหลด…</div></div>
<div id="toasts"></div>
<div id="welcome"></div>
<button id="snd" title="เปิด/ปิดเสียงบทสวด">🔇</button>
<div id="gate" class="off"><h1 id="gname"></h1><p id="gsub"></p><div class="sp"></div><div class="tap" id="gatetap">กำลังเตรียมบทสวด…</div></div>
<div id="ytbox"><div id="yt"></div></div><div id="ythint"></div>
<div id="panel">
  <div class="row">
    <button class="tab on" data-k="p">🙏 ไหว้พระ</button>
    <button class="tab" data-k="w" id="tabw"></button>
  </div>
  <div class="row" id="styles">
    <button class="st on" data-s="0"><b>🪷</b>ดอกบัว</button>
    <button class="st" data-s="1"><b>💮</b>พวงมาลัย</button>
    <button class="st" data-s="2"><b>🕯️</b>ธูปเทียน</button>
  </div>
  <input id="wish" maxlength="60" placeholder="คำอธิษฐาน (ไม่ใส่ก็ได้)">
  <button id="go">ไหว้พระ 🙏</button>
  <div id="msg"></div>
</div>
<button id="again">🙏 ร่วมบุญอีก</button>

      if (!visFirst && v.id !== myVid) toast('🙏 ยินดีต้อนรับ ' + v.name);
    }
  }
  for (const id of [...visitors.keys()]) if (!keep.has(id)) visitors.delete(id);
  visFirst = false;
}
function welcome(name) {
  const el = $('welcome'); el.textContent = '🙏 ยินดีต้อนรับ ' + name + ' 🙏';
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function drawKneel(v, x, y, s, t) {
  const b = Math.pow(Math.max(0, Math.sin(t * .45 + v.ph)), 12);   // ก้มกราบเป็นระยะ
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, 1, 17, 4, 0, 0, 7); ctx.fill();
  // ฝ่าเท้า
  ctx.fillStyle = '#e9b88f'; ctx.beginPath(); ctx.ellipse(-6, -1.5, 3.6, 2.3, 0, 0, 7); ctx.ellipse(6, -1.5, 3.6, 2.3, 0, 0, 7); ctx.fill();
  // ขาที่พับนั่ง
  ctx.fillStyle = v.c2; ctx.beginPath(); (ctx.roundRect ? ctx.roundRect(-15, -13, 30, 11, 5) : ctx.rect(-15, -13, 30, 11)); ctx.fill();
  ctx.translate(0, -11 + b * 5); ctx.scale(1, 1 - b * .25);
  // ลำตัว
  ctx.fillStyle = v.c1; ctx.beginPath(); ctx.moveTo(-11, 0); ctx.lineTo(11, 0); ctx.lineTo(9, -24); ctx.lineTo(-9, -24); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#d9a640'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-7, -23); ctx.lineTo(9, -2); ctx.stroke();
  // ศอกที่พนมมือ (มองจากด้านหลัง)
  ctx.strokeStyle = v.c1; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-9, -21); ctx.lineTo(-13, -12); ctx.lineTo(-5, -15); ctx.moveTo(9, -21); ctx.lineTo(13, -12); ctx.lineTo(5, -15); ctx.stroke();
  // คอ + หัว (ด้านหลัง)
  ctx.fillStyle = '#e9b88f'; ctx.fillRect(-3, -29, 6, 6);
  ctx.translate(0, b * 4);
  ctx.beginPath(); ctx.ellipse(-10, -35, 2.4, 3.4, 0, 0, 7); ctx.ellipse(10, -35, 2.4, 3.4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = v.hair; ctx.beginPath(); ctx.arc(0, -37, 10, 0, 7); ctx.fill();
  if (v.long) { ctx.beginPath(); (ctx.roundRect ? ctx.roundRect(-9.5, -38, 19, 18, 5) : ctx.rect(-9.5, -38, 19, 18)); ctx.fill(); }
  ctx.restore();
  label(ctx, v.name, x, y - 58 * s, Math.max(9, 9.5 * s), '#fff', undefined, v.id === myVid ? '#7fe0ff' : (v.born && tNow - v.born < 8 ? '#ffd27a' : undefined));
}
function drawVisitors(t) {
  const list = [...visitors.values()].sort((a, b) => a.ts - b.ts || (a.id > b.id ? 1 : -1));
  const top = L.altarY + OFFER_BAND + 100, perRow = Math.max(4, Math.floor((W - 20) / 58));
  list.forEach((v, i) => {
    const row = Math.floor(i / perRow), col = i % perRow;
    const cnt = Math.min(perRow, list.length - row * perRow), span = Math.min(W - 20, cnt * 58);
    const s = Math.min(1.3, .85 + row * .12);
    const x = W / 2 - span / 2 + (col + .5) * span / cnt + ((row % 2) ? 14 : 0);
    let y = top + row * 62;
    if (y > H + 20) return;
    let a = 1;
    if (v.born) { const k = Math.min(1, (t - v.born) / 1.4); a = k; y += (1 - k) * 50; }
    ctx.globalAlpha = a; drawKneel(v, x, y, s, t); ctx.globalAlpha = 1;
  });
}

// ---------- ข้อมูล ----------
const sprites = new Map();
let lastList = [], firstLoad = true, myId = null, total = 0, tNow = 0;
function makeSprite(it, fresh) {
  const r = seeded(hash(it.id));
  if (it.kind === 'w') return { it, w: true, fx: r(), ph: r() * 6, t0: fresh ? tNow : tNow - r() * 14, born: fresh ? tNow : 0 };
  return { it, rx: r(), ry: r(), ph: r() * 6, born: fresh ? tNow : 0 };
}
function syncItems(list, ownId) {
  lastList = list;
  const ps = list.filter(i => i.kind === 'p').slice(-40), ws = list.filter(i => i.kind === 'w').slice(-20);
  const keep = new Set(); let newCount = 0;
  for (const it of ps.concat(ws)) {
    keep.add(it.id);
    if (!sprites.has(it.id)) {
      const fresh = !firstLoad;
      const sp = makeSprite(it, fresh);
      sprites.set(it.id, sp);
      if (fresh && L.b) { sp.hidden = true; addActor(sp, newCount++ * 1.6); }
      if (fresh) toast(it.id === ownId ? (it.kind === 'w' ? wEmoji() + ' ' + wLabel() + 'แล้ว สาธุ' : '✨ ไหว้พระแล้ว อนุโมทนาบุญ 🙏')
        : `${it.kind === 'w' ? wEmoji() : '🙏'} ${it.name} ${it.kind === 'w' ? wLabel() : 'ไหว้พระ'}${it.wish ? ' — ' + it.wish : ''}`);
    }
  }
  for (const id of [...sprites.keys()]) if (!keep.has(id)) sprites.delete(id);
  // จัดตำแหน่งของถวายบนโต๊ะ เรียงใหม่ทุกครั้ง (ใหม่สุดอยู่หน้า)
  const offs = [...sprites.values()].filter(s => !s.w);
  offs.sort((a, b) => (a.it.ts || 0) - (b.it.ts || 0) || (a.it.id > b.it.id ? 1 : -1));
  offs.forEach((o, i) => o.idx = i);
  firstLoad = false;
}
function placeOfferings() {
  const all = [...sprites.values()].filter(s => !s.w);
  const perRow = Math.max(4, Math.floor((W - 30) / 62));
  const offs = all.filter(o => o.idx >= all.length - perRow * 2), n = offs.length, base = all.length - n;
  for (const o of all) o.sx = null;
  for (const o of offs) {
    const i = o.idx - base, row = Math.floor(i / perRow), col = i % perRow;
    const cnt = Math.min(perRow, n - row * perRow);
    const span = Math.min(W - 30, cnt * 62);
    o.x = W / 2 - span / 2 + (col + .5) * span / cnt + (o.rx - .5) * 8;
    o.s = .7;
    o.y = L.altarY + 40 + row * 34;
    o.sx = o.x; o.sy = o.y - 8;
  }
  return offs;
}
OFFER_BAND = 0;
function setCount(n) { total = n; $('count').textContent = `ร่วมบุญแล้ว ${n.toLocaleString('th-TH')} ครั้ง · แตะชื่อเพื่ออ่านคำอธิษฐาน`; }
function toast(s) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = s;
  const box = $('toasts'); box.appendChild(d); while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => d.remove(), 5200);
}
async function poll() {
  if (DEMO) return;
  try {
    const pl = T && T.id; if (!pl) return;
    const j = await (await fetch(API + '?action=list&kinds=pw&place=' + pl + '&chat=' + encodeURIComponent(chat))).json();
    if (!T || T.id !== pl) return;
    if (j.ok) { syncItems(j.items); setCount(j.total); if (j.visitors) syncVisitors(j.visitors); }
  } catch (e) {}
}

// ---------- แอนิเมชัน ----------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (!T || loaded < 3 || !L.b) return;
  const dt = Math.min(.05, (now - last) / 1000); last = now; tNow = now / 1000; const t = tNow;
  ctx.drawImage(bg, 0, 0, W, H);
  // ฝุ่นแสงลอย
  for (const d of dust) {
    const y = ((d.y * L.altarY - t * d.sp) % L.altarY + L.altarY) % L.altarY;
    ctx.globalAlpha = .25 + .35 * Math.abs(Math.sin(t + d.ph));
    ctx.fillStyle = '#ffd88a'; ctx.beginPath(); ctx.arc(d.x * W + Math.sin(t * .5 + d.ph) * 6, y, d.s, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // เทียนหน้าพระและหน้าท้าวเวสสุวรรณ
  const b = L.b, w = L.w, ay = L.altarY;
  for (let i = 0; i < 2; i++) { const x = b.x + b.w * (i ? .84 : .16); candle(x, ay + 2, b.h * .16, 1.2, t, i * 2); }
  for (let i = 0; i < 2; i++) { const x = w.x + w.w * (i ? .85 : .15); candle(x, ay + 2, w.h * .1, .9, t, i * 3 + 1); }
  // กระถางธูป + ควัน
  const ux = b.x + b.w / 2, uy = ay + 8;
  if (Math.random() < dt * 9) smoke.push({ x: ux + (Math.random() - .5) * 12, y: uy - 26, a: .35, r: 3, vx: (Math.random() - .5) * 6 });
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 1.5;
  for (const dx of [-8, -3, 2, 7]) { ctx.beginPath(); ctx.moveTo(ux + dx * .5, uy - 8); ctx.lineTo(ux + dx, uy - 28); ctx.stroke(); glow(ux + dx, uy - 28, 4, 'rgba(255,90,40,.9)'); }
  ctx.fillStyle = '#c89a3c'; ctx.beginPath(); ctx.ellipse(ux, uy - 6, 18, 6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#9a6e20'; ctx.beginPath(); ctx.moveTo(ux - 18, uy - 6); ctx.quadraticCurveTo(ux - 16, uy + 10, ux, uy + 11); ctx.quadraticCurveTo(ux + 16, uy + 10, ux + 18, uy - 6); ctx.fill();
  for (const p of smoke) {
    p.y -= 18 * dt; p.x += (p.vx + Math.sin(t * 1.5 + p.y * .05) * 8) * dt; p.r += 6 * dt; p.a -= .055 * dt;
    if (p.a > 0) { ctx.fillStyle = `rgba(230,220,210,${p.a * .35})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  }
  smoke = smoke.filter(p => p.a > 0 && p.y > 0);
  // ของถวาย + พรที่ลอยขึ้น
  drawVisitors(t);
  drawRosePiles(t);
  updateActors(t, dt);
  for (const a of actors) drawActor(a, t);
  for (const s of sprites.values()) if (s.w && !s.hidden) drawWish(s, t);
}

// ---------- ฟอร์ม ----------
let kind = 'p', style = 0;
document.querySelectorAll('.tab').forEach(bt => bt.onclick = () => {

});
document.querySelectorAll('.st').forEach(bt => bt.onclick = () => {

});
$('again').onclick = () => { $('panel').classList.remove('hide'); $('again').style.display = 'none'; };
$('go').onclick = async () => {
  const wish = $('wish').value.trim().slice(0, 60), go = $('go'), msg = $('msg');
  go.disabled = true; msg.textContent = '';

    else {
      const j = await (await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'float', initData: tg.initData, wish, kind, style, place: T.id, placeName: T.name, label: kind === 'w' ? wLabel() : 'ไหว้พระ' }) })).json();
      if (!j.ok) { msg.textContent = j.error || 'ไม่สำเร็จ ลองใหม่อีกครั้ง'; go.disabled = false; return; }

cv.addEventListener('click', e => {
  let best = null, bd = 1e9;
  for (const s of sprites.values()) {
    if (s.sx == null || s.hidden) continue;
    const d = Math.hypot(s.sx - e.clientX, s.sy - e.clientY);

  }

});

// ---------- เสียงบทสวด ----------
// เสียงบทสวดเจ้าแม่กวนอิม จาก YouTube (เริ่มที่ 0:35)
let started = false, ytp = null, ytReady = false, myName = null;
function openGate() {
  if (!$('gate').classList.contains('off')) {
    $('gate').classList.add('off');
    $('ytbox').classList.remove('big'); if (started) $('ytbox').classList.add('on');
    if (myName) setTimeout(() => welcome(myName), 400);
  }
}
window.onYouTubeIframeAPIReady = () => {
  ytp = new YT.Player('yt', {
    width: 300, height: 169, videoId: T ? T.yt : TEMPLES[0].yt,
    playerVars: { start: T ? T.start : TEMPLES[0].start, playsinline: 1, controls: 0, rel: 0, modestbranding: 1, disablekb: 1, fs: 0, iv_load_policy: 3 },
    events: {
      onReady: () => {
        ytReady = true; ytp.setVolume(70);
        if (T && !$('gate').classList.contains('off')) prepareGateVideo();
      },
      onStateChange: e => {
        const S = YT.PlayerState;
        if (e.data === S.ENDED && T) { ytp.seekTo(T.start, true); ytp.playVideo(); }
        if (e.data === S.PLAYING) { if (!T) { ytp.pauseVideo(); return; } started = true; try { ytp.unMute(); ytp.setVolume(70); } catch (x) {} openGate(); }
        if (e.data === S.PAUSED && started) { ytp.playVideo(); }   // เล่นต่ออัตโนมัติ ไม่ให้หยุด
      },
      onError: () => { $('gatetap').textContent = '👆 แตะเพื่อเข้าวัด'; gateFallback = true; }
    }
  });
};
let gateFallback = false, curVid = null;
function prepareGateVideo() {
  $('ytbox').classList.remove('on'); $('ytbox').classList.add('big');
  $('gatetap').textContent = '👆 แตะปุ่ม ▶ เพื่อเข้าวัด';
  try {
    if (curVid !== T.yt) { curVid = T.yt; ytp.loadVideoById({ videoId: T.yt, startSeconds: T.start }); }
    else { ytp.seekTo(T.start, true); ytp.playVideo(); }
  } catch (e) {}
}
(() => { const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; sc.onerror = () => { gateFallback = true; $('gatetap').textContent = '👆 แตะเพื่อเข้าวัด'; }; document.head.appendChild(sc); })();
// ถ้าโหลด YouTube ไม่ได้ภายใน 10 วินาที ให้เข้าวัดได้โดยไม่มีเสียง
setTimeout(() => { if (!ytReady) { gateFallback = true; $('gatetap').textContent = '👆 แตะเพื่อเข้าวัด'; } }, 10000);
$('gate').addEventListener('click', () => {
  if (ytReady) { try { ytp.unMute(); ytp.playVideo(); } catch (e) {} }   // คอมพิวเตอร์แตะตรงไหนก็เล่นได้
  if (gateFallback) openGate();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && started && ytp) try { ytp.playVideo(); } catch (e) {} });

addEventListener('resize', () => { if (T) resize(); });
const DEMO_NAMES = ['น้องฟ้า', 'พี่ต้น', 'มะปราง', 'ลุงหนวด', 'จิ๊บ', 'บอย', 'แม่ค้าออนไลน์', 'สมชาย', 'เจ๊หมวย', 'ป๊อป', 'ใบเตย', 'ก้อง', 'ยายศรี', 'นุ่น'];
const DEMO_WISH = ['ขอให้ค้าขายร่ำรวย', 'ขอให้สุขภาพแข็งแรง', 'ขอให้ครอบครัวมีความสุข', 'ขอให้สอบผ่าน', 'ขอให้มีโชคลาภ', ''];
function buildLobby() {
  const grid = $('grid'); grid.innerHTML = '';
  TEMPLES.forEach((tp, i) => {
    const b = document.createElement('button'); b.className = 'card' + (tp ? '' : ' soon');
    const no = document.createElement('span'); no.className = 'no'; no.textContent = 'วัดที่ ' + (i + 1); b.appendChild(no);
    const nm = document.createElement('div'); nm.className = 'nm';
    if (tp) { b.style.backgroundImage = 'url(' + tp.img.gate + ')'; nm.textContent = tp.name; b.onclick = () => enterTemple(i); }
    else { const lk = document.createElement('div'); lk.className = 'lk'; lk.textContent = '🛕'; b.appendChild(lk); nm.textContent = 'เร็ว ๆ นี้'; }

}
function resetState() {

  lastList = []; firstLoad = true; visFirst = true; myId = null; myVid = null; total = 0;
  $('toasts').innerHTML = ''; $('count').textContent = 'กำลังโหลด…';
  $('panel').classList.remove('hide'); $('again').style.display = 'none'; $('msg').textContent = '';
}
function enterTemple(i) {
  T = TEMPLES[i]; resetState();
  document.title = 'ไหว้พระ ' + T.name;
  $('sub').textContent = 'ไหว้พระ · ' + (T.offer === 'roses' ? 'ขอพร' : 'ไหว้') + T.deity;
  $('gname').textContent = '🙏 ' + T.name + ' 🙏';
  $('gsub').textContent = (T.sub ? T.sub + ' · ' : '') + 'ไหว้พระ · ขอพร' + T.deity;
  $('tabw').textContent = wEmoji() + ' ขอพร' + T.deity;
  document.querySelector('.tab[data-k="p"]').click();
  loadTempleImages();
  $('lobby').classList.add('off'); $('home').style.display = 'block';
  $('gate').classList.remove('off');
  if (ytReady) prepareGateVideo(); else $('gatetap').textContent = gateFallback ? '👆 แตะเพื่อเข้าวัด' : 'กำลังเตรียมบทสวด…';
  if (DEMO) {
    const demo = DEMO_NAMES.map((n, k) => ({ id: T.id + 'd' + k, name: n, wish: DEMO_WISH[k % DEMO_WISH.length], kind: k % 3 === 2 ? 'w' : 'p', style: k % 3, ts: k }));
    syncItems(demo); setCount(demo.length);
    syncVisitors(DEMO_NAMES.slice(0, 10).map((n, k) => ({ id: 'v' + k, name: n, ts: k })).concat([{ id: 'vme', name: 'PARKKA', ts: 50 }]));
    myVid = 'vme'; myName = 'PARKKA';
    $('msg').textContent = 'โหมดตัวอย่าง — เปิดจากปุ่มในกลุ่มเทเลแกรมเพื่อร่วมบุญจริง';
  } else {
    const pl = T.id;
    (async () => {
      try {
        const j = await (await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'join', initData: tg.initData, place: pl }) })).json();
        if (j.ok && T && T.id === pl) { myVid = j.id; myName = j.name; if ($('gate').classList.contains('off')) welcome(j.name); }

  }
}
function goLobby() {

  try { ytp && ytp.pauseVideo(); } catch (e) {}
  $('ytbox').classList.remove('on', 'big');

$('home').onclick = goLobby;
buildLobby();
if (!DEMO) setInterval(poll, 4000);
requestAnimationFrame(frame);
